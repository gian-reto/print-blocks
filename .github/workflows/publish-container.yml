name: Publish container image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/gian-reto/print-blocks
  REGISTRY: ghcr.io

jobs:
  validate:
    name: Validate source ref
    runs-on: ubuntu-24.04
    permissions:
      contents: read # Required by actions/checkout.

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0.
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            exit 0
          fi

          if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf '::error::Release tags must match vMAJOR.MINOR.PATCH.\n' >&2
            exit 1
          fi

          main_ref="refs/remotes/origin/main"
          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"

          if ! git rev-parse --verify "${main_ref}^{commit}" >/dev/null; then
            printf '::error::The origin/main ref is unavailable.\n' >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "${tag_commit}" "${main_ref}"; then
            printf '::error::The release tag must point to a commit reachable from main.\n' >&2
            exit 1
          fi

  build-amd64:
    name: Build and test linux/amd64
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read # Required by actions/checkout.
      packages: write # Required to push the platform image to GHCR.
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0.
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.2.0.

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.4.0.
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.3.0.
        with:
          cache-from: type=gha,scope=container-linux-amd64
          cache-to: type=gha,mode=max,ignore-error=true,scope=container-linux-amd64
          context: .
          file: ./Containerfile
          labels: |
            org.opencontainers.image.title=print-blocks
            org.opencontainers.image.description=Print structured documents on ESC/POS thermal printers over HTTP or MCP.
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push=true,push-by-digest=true,name-canonical=true,oci-artifact=true
          platforms: linux/amd64
          provenance: mode=max
          sbom: true

      - name: Smoke test image
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -Eeuo pipefail

          container_name="print-blocks-smoke-amd64"
          trap 'docker rm --force "${container_name}" >/dev/null 2>&1 || true' EXIT

          docker run --detach \
            --name "${container_name}" \
            --env API_TOKEN=0123456789abcdef0123456789abcdef \
            --publish 127.0.0.1::3000 \
            "${IMAGE_NAME}@${IMAGE_DIGEST}"

          address="$(docker port "${container_name}" 3000/tcp)"
          port="${address##*:}"

          for _ in {1..30}; do
            response="$(curl --fail --silent "http://127.0.0.1:${port}/healthz" 2>/dev/null || true)"

            if [[ "${response}" == '{"ok":true}' ]]; then
              exit 0
            fi

            if [[ "$(docker inspect --format '{{.State.Running}}' "${container_name}")" != "true" ]]; then
              break
            fi

            sleep 1
          done

          docker logs "${container_name}" >&2
          printf '::error::Container health check failed.\n' >&2
          exit 1

  build-arm64:
    name: Build and test linux/arm64
    needs: validate
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read # Required by actions/checkout.
      packages: write # Required to push the platform image to GHCR.
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0.
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.2.0.

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.4.0.
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.3.0.
        with:
          cache-from: type=gha,scope=container-linux-arm64
          cache-to: type=gha,mode=max,ignore-error=true,scope=container-linux-arm64
          context: .
          file: ./Containerfile
          labels: |
            org.opencontainers.image.title=print-blocks
            org.opencontainers.image.description=Print structured documents on ESC/POS thermal printers over HTTP or MCP.
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push=true,push-by-digest=true,name-canonical=true,oci-artifact=true
          platforms: linux/arm64
          provenance: mode=max
          sbom: true

      - name: Smoke test image
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -Eeuo pipefail

          container_name="print-blocks-smoke-arm64"
          trap 'docker rm --force "${container_name}" >/dev/null 2>&1 || true' EXIT

          docker run --detach \
            --name "${container_name}" \
            --env API_TOKEN=0123456789abcdef0123456789abcdef \
            --publish 127.0.0.1::3000 \
            "${IMAGE_NAME}@${IMAGE_DIGEST}"

          address="$(docker port "${container_name}" 3000/tcp)"
          port="${address##*:}"

          for _ in {1..30}; do
            response="$(curl --fail --silent "http://127.0.0.1:${port}/healthz" 2>/dev/null || true)"

            if [[ "${response}" == '{"ok":true}' ]]; then
              exit 0
            fi

            if [[ "$(docker inspect --format '{{.State.Running}}' "${container_name}")" != "true" ]]; then
              break
            fi

            sleep 1
          done

          docker logs "${container_name}" >&2
          printf '::error::Container health check failed.\n' >&2
          exit 1

  publish:
    name: Publish multi-platform image
    needs:
      - build-amd64
      - build-arm64
    runs-on: ubuntu-24.04
    permissions:
      attestations: write # Required to publish the GitHub artifact attestation.
      contents: read # Required by docker/metadata-action.
      id-token: write # Required for OIDC-backed provenance.
      packages: write # Required to publish the image index and attestation.

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.2.0.

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0.
        with:
          annotations: |
            org.opencontainers.image.title=print-blocks
            org.opencontainers.image.description=Print structured documents on ESC/POS thermal printers over HTTP or MCP.
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          flavor: latest=false
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.4.0.
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-platform image index
        id: manifest
        shell: bash
        env:
          AMD64_DIGEST: ${{ needs.build-amd64.outputs.digest }}
          ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
          ARM64_DIGEST: ${{ needs.build-arm64.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -Eeuo pipefail

          args=()

          while IFS= read -r tag; do
            if [[ -n "${tag}" ]]; then
              args+=(--tag "${tag}")
            fi
          done <<< "${TAGS}"

          while IFS= read -r annotation; do
            if [[ -n "${annotation}" ]]; then
              args+=(--annotation "${annotation}")
            fi
          done <<< "${ANNOTATIONS}"

          metadata_file="${RUNNER_TEMP}/manifest-metadata.json"

          docker buildx imagetools create \
            --metadata-file "${metadata_file}" \
            "${args[@]}" \
            "${IMAGE_NAME}@${AMD64_DIGEST}" \
            "${IMAGE_NAME}@${ARM64_DIGEST}"

          digest="$(jq --exit-status --raw-output '.["containerimage.descriptor"].digest' "${metadata_file}")"
          printf 'digest=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"

          docker buildx imagetools inspect "${IMAGE_NAME}@${digest}"

      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.1.1.
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
