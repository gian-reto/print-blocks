services:
  print-blocks:
    build:
      context: .
      dockerfile: Containerfile
    env_file:
      - .env
    environment:
      API_TOKEN: ${API_TOKEN}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-3000}
      CUPS_SERVER: ${CUPS_SERVER:-/run/cups/cups.sock}
      PRINTER_NAME: ${PRINTER_NAME}
      PRINTER_TYPE: ${PRINTER_TYPE:-epson}
      PRINTER_WIDTH: ${PRINTER_WIDTH:-48}
      PRINTER_CHARACTER_SET: ${PRINTER_CHARACTER_SET:-pc437_usa}
      PRINT_TIMEOUT_MS: ${PRINT_TIMEOUT_MS:-15000}
      EXPOSE_DOCS: ${EXPOSE_DOCS:-false}
      EXPOSE_LLMS_TXT: ${EXPOSE_LLMS_TXT:-false}
      EXPOSE_MCP: ${EXPOSE_MCP:-false}
      MCP_TOKEN: ${MCP_TOKEN}
      MAX_BLOCKS_PER_PRINT_JOB: ${MAX_BLOCKS_PER_PRINT_JOB:-50}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-10485760}
      MAX_TEXT_CHARS_PER_BLOCK: ${MAX_TEXT_CHARS_PER_BLOCK:-5000}
    volumes:
      - /run/cups/cups.sock:/run/cups/cups.sock
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
